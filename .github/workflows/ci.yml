name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          # File-rotation handling differs on Windows, so test it there too.
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest --cov=cyber_alert --cov-report=term-missing

  docker:
    # End-to-end: build the image, run the dashboard against the attack simulator,
    # and require every kind of simulated attack to be detected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the dashboard and simulator
        run: docker compose up --detach --build --wait
        env:
          SIMULATOR_SPEED: "5"
      - name: Wait for all three alert types
        run: |
          for attempt in $(seq 1 45); do
            kinds=$(curl -fsS http://127.0.0.1:5000/api/alerts \
              | python3 -c "import json, sys; print(len({a['rule_id'] for a in json.load(sys.stdin)['alerts']}))" \
              || echo 0)
            if [ "$kinds" = "3" ]; then
              echo "All three alert types raised after about $((attempt * 2)) seconds"
              exit 0
            fi
            sleep 2
          done
          echo "Expected all three alert types within 90 seconds"
          exit 1
      - name: Show container logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
